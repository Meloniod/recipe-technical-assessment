services:
  backend:
    build:
      context: ./recipe-backend
      dockerfile: Api/Dockerfile
    container_name: recipe-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Cors__AllowedOrigins__0: http://localhost:4200
      Cors__AllowedOrigins__1: http://localhost:80
      Cors__AllowedOrigins__2: http://frontend:80
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - recipe-network

  frontend:
    build:
      context: ./recipe-ui
      dockerfile: Dockerfile
    container_name: recipe-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    environment:
      API_URL: http://localhost:8080
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - recipe-network

networks:
  recipe-network:
    driver: bridge
